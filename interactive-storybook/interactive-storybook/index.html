<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Girl Beyond the Window — An Interactive Storybook</title>
<meta name="description" content="An interactive 3D storybook: The Girl Beyond the Window, by Jennelyn Portea." />
<meta name="theme-color" content="#2b1d14" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body data-theme="day" data-font-size="medium" data-motion="full">

  <!-- ============ LOADING SCREEN ============ -->
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-book" aria-hidden="true">
      <div class="loading-cover"></div>
      <div class="loading-page loading-page--1"></div>
      <div class="loading-page loading-page--2"></div>
    </div>
    <p class="loading-text">Preparing your story&hellip;</p>
  </div>

  <!-- ============ 3D CANVAS MOUNT ============ -->
  <main id="scene-container" aria-label="3D storybook" data-motion-safe>
    <canvas id="book-canvas" aria-hidden="true"></canvas>

    <!-- Screen-reader-only live narration of current page content -->
    <div id="sr-page-content" class="sr-only" aria-live="polite"></div>
  </main>

  <!-- ============ AMBIENT DUST PARTICLES (decorative CSS layer) ============ -->
  <div class="ambient-dust" aria-hidden="true"></div>

  <!-- ============ TOP-LEFT: PROGRESS ============ -->
  <div id="reading-progress" class="reading-progress" hidden>
    <span id="progress-chapter">Chapter I</span>
    <span class="reading-progress__dot">&middot;</span>
    <span id="progress-percent">0%</span>
  </div>

  <!-- ============ COVER OVERLAY UI ============ -->
  <div id="cover-ui" class="cover-ui">
    <button id="open-book-btn" class="btn btn--primary" type="button">
      Open Book
    </button>
  </div>

  <!-- ============ BOTTOM CONTROL BAR (hidden on cover) ============ -->
  <nav id="control-bar" class="control-bar" aria-label="Book controls" hidden>
    <button id="btn-prev" class="ctrl" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Previous</span>
    </button>

    <button id="btn-toc" class="ctrl" type="button" aria-label="Table of contents" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Contents</span>
    </button>

    <button id="btn-bookmark" class="ctrl" type="button" aria-label="Bookmark this page" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21V3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Bookmark</span>
    </button>

    <button id="btn-settings" class="ctrl" type="button" aria-label="Reading settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>

    <button id="btn-close" class="ctrl" type="button" aria-label="Close book, return to cover">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Close</span>
    </button>

    <button id="btn-next" class="ctrl" type="button" aria-label="Next page">
      <span>Next</span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <!-- ============ TABLE OF CONTENTS PANEL ============ -->
  <div id="toc-panel" class="side-panel" role="dialog" aria-modal="true" aria-labelledby="toc-heading" hidden>
    <div class="side-panel__inner">
      <div class="side-panel__header">
        <h2 id="toc-heading">Contents</h2>
        <button class="panel-close" data-close="toc-panel" aria-label="Close contents">&times;</button>
      </div>
      <ol id="toc-list" class="toc-list"></ol>
      <button id="btn-goto-bookmark" class="btn btn--ghost" type="button" hidden>Go to bookmark</button>
    </div>
  </div>

  <!-- ============ SETTINGS PANEL ============ -->
  <div id="settings-panel" class="side-panel" role="dialog" aria-modal="true" aria-labelledby="settings-heading" hidden>
    <div class="side-panel__inner">
      <div class="side-panel__header">
        <h2 id="settings-heading">Reading Settings</h2>
        <button class="panel-close" data-close="settings-panel" aria-label="Close settings">&times;</button>
      </div>

      <fieldset class="setting-group">
        <legend>Font size</legend>
        <div class="segmented" data-setting="fontSize">
          <button type="button" data-value="small">Small</button>
          <button type="button" data-value="medium" aria-pressed="true">Medium</button>
          <button type="button" data-value="large">Large</button>
        </div>
      </fieldset>

      <fieldset class="setting-group">
        <legend>Reading mode</legend>
        <div class="segmented" data-setting="theme">
          <button type="button" data-value="day" aria-pressed="true">Day</button>
          <button type="button" data-value="sepia">Sepia</button>
          <button type="button" data-value="night">Night</button>
        </div>
      </fieldset>

      <fieldset class="setting-group">
        <legend>Page animation</legend>
        <div class="segmented" data-setting="motion">
          <button type="button" data-value="full" aria-pressed="true">Full</button>
          <button type="button" data-value="reduced">Reduced</button>
        </div>
      </fieldset>

      <fieldset class="setting-group">
        <legend>Ambient sound</legend>
        <div class="segmented segmented--wrap" data-setting="ambient">
          <button type="button" data-value="none" aria-pressed="true">None</button>
          <button type="button" data-value="rain">Rain</button>
          <button type="button" data-value="fireplace">Fireplace</button>
          <button type="button" data-value="forest">Forest</button>
          <button type="button" data-value="library">Library</button>
        </div>
        <p class="setting-hint">Sound stays off until you choose one. No file is required — this is a gentle generated ambience.</p>
      </fieldset>
    </div>
  </div>

  <div id="panel-scrim" class="panel-scrim" hidden></div>

  <!-- Templates for illustration <img> preloading (helps caching/SW) -->
  <div id="asset-preload" hidden aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="story.js"></script>
  <script src="script.js"></script>
</body>
</html>
