<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <radialGradient id="candle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f6d98a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a1c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241611"/>
      <stop offset="100%" stop-color="#100a08"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg2)"/>
  <circle cx="450" cy="300" r="320" fill="url(#candle)"/>

  <!-- candle -->
  <g transform="translate(450,470)">
    <rect x="-8" y="-10" width="16" height="60" fill="#e9dcc0"/>
    <ellipse cx="0" cy="-16" rx="6" ry="10" fill="#f7c65a"/>
    <ellipse cx="0" cy="-20" rx="3" ry="6" fill="#fff2c8"/>
  </g>

  <!-- girl silhouette holding a letter -->
  <g transform="translate(450,430)">
    <path d="M-70,190 C-88,90 -60,20 0,0 C60,20 88,90 70,190 Z" fill="#171009"/>
    <circle cx="0" cy="-40" r="32" fill="#171009"/>
    <path d="M20,-44 C34,-16 30,30 40,86 C42,102 34,108 26,100 C30,54 26,4 14,-38 Z" fill="#110b06"/>
    <!-- arms holding letter -->
    <path d="M-30,20 C-40,50 -20,66 10,64" stroke="#171009" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M30,20 C40,50 20,66 -10,64" stroke="#171009" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the letter, glowing -->
  <g transform="translate(450,300) rotate(-4)">
    <rect x="-70" y="-50" width="140" height="100" fill="#f3e8cf" stroke="#c9a66b" stroke-width="2"/>
    <line x1="-46" y1="-20" x2="46" y2="-20" stroke="#8a7350" stroke-width="2"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#8a7350" stroke-width="2"/>
    <line x1="-46" y1="20" x2="20" y2="20" stroke="#8a7350" stroke-width="2"/>
  </g>
</svg>
