<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <radialGradient id="glow5" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3d98a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#241611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1420"/>
      <stop offset="100%" stop-color="#3a241c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg5)"/>
  <circle cx="450" cy="330" r="320" fill="url(#glow5)"/>

  <!-- two mirrored silhouettes, facing each other -->
  <g transform="translate(340,430)">
    <path d="M-50,150 C-64,70 -44,20 0,4 C44,20 64,70 50,150 Z" fill="#140d0a"/>
    <circle cx="0" cy="-30" r="26" fill="#140d0a"/>
    <path d="M16,-34 C28,-10 24,26 32,72 C34,86 27,90 20,84 C24,44 20,4 10,-32 Z" fill="#0f0a08"/>
  </g>
  <g transform="translate(560,430) scale(-1,1)">
    <path d="M-50,150 C-64,70 -44,20 0,4 C44,20 64,70 50,150 Z" fill="#1c130f"/>
    <circle cx="0" cy="-30" r="26" fill="#1c130f"/>
    <path d="M16,-34 C28,-10 24,26 32,72 C34,86 27,90 20,84 C24,44 20,4 10,-32 Z" fill="#150e0b"/>
  </g>

  <!-- shared light between them -->
  <ellipse cx="450" cy="470" rx="60" ry="16" fill="#eec36a" opacity="0.3"/>
</svg>
