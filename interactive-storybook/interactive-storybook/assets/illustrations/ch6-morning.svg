<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b98a"/>
      <stop offset="45%" stop-color="#f2cf9b"/>
      <stop offset="100%" stop-color="#f7e6c4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#dawn)"/>

  <!-- sun -->
  <circle cx="450" cy="420" r="140" fill="#fbead0" opacity="0.9"/>

  <!-- rolling hills -->
  <path d="M0,560 C200,500 350,540 500,510 C650,480 780,530 900,500 L900,700 L0,700 Z" fill="#c98a5a" opacity="0.7"/>
  <path d="M0,620 C220,580 400,610 600,590 C720,580 820,600 900,590 L900,700 L0,700 Z" fill="#a8623c" opacity="0.85"/>

  <!-- girl, arms slightly open, facing the sunrise -->
  <g transform="translate(450,470)">
    <path d="M-46,150 C-58,70 -40,20 0,4 C40,20 58,70 46,150 Z" fill="#241811"/>
    <circle cx="0" cy="-32" r="24" fill="#241811"/>
    <path d="M14,-36 C24,-12 20,24 28,68 C30,80 24,84 18,78 C22,42 18,4 8,-34 Z" fill="#1c130e"/>
    <path d="M-24,20 C-46,10 -58,-8 -54,-24" stroke="#241811" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M24,20 C46,10 58,-8 54,-24" stroke="#241811" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- birds -->
  <g stroke="#5a3826" stroke-width="3" fill="none" opacity="0.6">
    <path d="M120,140 q10,-10 20,0 q10,-10 20,0"/>
    <path d="M700,180 q8,-8 16,0 q8,-8 16,0"/>
  </g>
</svg>
